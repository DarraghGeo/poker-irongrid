name: Publish to npm

# Publishes poker-irongrid with npm trusted publishing (OIDC): no npm token is stored in the repo.
# Runs on every push to main, but only publishes when package.json's version is not on npm yet,
# so bump the version to release. Prerelease versions (e.g. 1.3.0-beta.0) go to the `next` tag.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # lets npm exchange the GitHub OIDC token for a short-lived publish credential

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      # Trusted publishing needs npm 11.5.1 or later
      - name: Update npm
        run: npm install -g npm@latest

      - name: Check whether this version is already published
        id: version
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already on npm; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "$NAME@$VERSION is not on npm yet; publishing."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$VERSION" == *-* ]]; then
            echo "tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.version.outputs.publish == 'true'
        run: npm ci

      # vite build + svelte-package + publint
      - name: Build
        if: steps.version.outputs.publish == 'true'
        run: npm run build

      - name: Publish
        if: steps.version.outputs.publish == 'true'
        run: npm publish --tag ${{ steps.version.outputs.tag }}
